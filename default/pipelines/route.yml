id: default
groups: {}
comments: []
routes:
  # Pack conventions:
  #   - id and pipeline must be descriptive (no 'main', no 'route1')
  #   - filter must be a real expression (not literally 'false' / '0')
  #   - output MUST be __group (not input_id)
  - id: transcript_mask
    name: AI CLI Credential Masking
    final: true
    disabled: false
    pipeline: transcript_mask
    description: "Routes AI CLI session-log events through credential masking."
    enableOutputExpression: false
    targetContext: group
    filter: "datatype=='ai-cli-jsonl'"
    clones: []
    output: __group
